server {
    listen 80;
    listen [::]:80;
    server_name 114.132.185.123;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /typing-dongnanya-api {
        return 308 https://$host/typing-dongnanya-api/;
    }

    location ^~ /typing-dongnanya-api/ {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 114.132.185.123;

    ssl_certificate /etc/letsencrypt/live/typing-dongnanya-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/typing-dongnanya-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TypingDongnanyaTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /typing-dongnanya-api {
        return 308 /typing-dongnanya-api/;
    }

    location ^~ /typing-dongnanya-api/ {
        client_max_body_size 128k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_pass http://127.0.0.1:18127/;
    }
}
