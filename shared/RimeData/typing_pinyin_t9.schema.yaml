# Rime schema
# encoding: utf-8

__include: typing_pinyin.schema:/

# Android 九键使用标准数字到拼音字母映射，布局和交互由本项目独立实现。
schema:
  schema_id: typing_pinyin_t9
  name: 中文九键
  version: "1.0"
  author:
    - Typing Dongnanya
  description: |
    通过 2–9 数字键输入歧义拼音，候选与词频复用项目 Apache-2.0 拼音数据。

speller:
  alphabet: 98765432
  initials: 98765432
  delimiter: " '"
  algebra:
    - xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/

translator:
  dictionary: typing_pinyin
  prism: typing_pinyin_t9
  enable_sentence: true
  enable_user_dict: true

punctuator:
  half_shape:
    "1": ["，", "。", "？", "！", "、", "；", "："]
  full_shape:
    "1": ["，", "。", "？", "！", "、", "；", "："]
